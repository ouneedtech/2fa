name = "cf-totp-vault"
main = "src/worker.js"
compatibility_date = "2026-10-01"
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "vault"
database_id = "00000000-0000-0000-0000-000000000000" # replace with your D1 database ID

[triggers]
crons = ["17 3 * * *"]

# Optional: use a zone managed by your Cloudflare account.
# Custom domain routes are managed separately (e.g. via API), not in wrangler.toml.
# SERVER_SECRET and SETUP_TOKEN must be configured as Worker secrets.
